plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pengatur.suara'
    compileSdk 34

    defaultConfig {
        applicationId 'com.pengatur.suara'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Ditandatangani dengan kunci debug agar APK langsung bisa dipasang.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
