plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pengatur.suara'
    compileSdk 34

    defaultConfig {
        applicationId 'com.pengatur.suara'
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName '1.3'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Ditandatangani dengan kunci debug agar APK langsung bisa dipasang.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
